<title id="title">Nearest-neighbour and 2-opt distance comparison</title><desc id="desc">Canonical seed 208304, five model-ranked zones, fixed origin MPR Ratna Park, great-circle geometry.</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="48" fill="#182d48" font-size="25" font-weight="700">Nearest-neighbour and 2-opt distance comparison</text><text x="48" y="76" fill="#68758b" font-size="13">Canonical seed 208304, five model-ranked zones, fixed origin MPR Ratna Park, great-circle geometry.</text><text x="240" y="154" text-anchor="end" fill="#182d48" font-size="12" font-weight="700">Frequency-only</text><rect x="260" y="135" width="650" height="25" rx="5" fill="#b7c3d2"/><text x="919" y="152" fill="#68758b" font-size="11">23.62 km</text><rect x="260" y="168" width="613.9500423370025" height="25" rx="5" fill="#2d766e"/><text x="882.9500423370025" y="185" fill="#2d766e" font-size="11">22.31 km</text><text x="1010" y="162" fill="#182d48" font-size="11" font-weight="700">5.51% saved</text><text x="240" y="246" text-anchor="end" fill="#182d48" font-size="12" font-weight="700">Severity-only</text><rect x="260" y="227" width="498.645215918713" height="25" rx="5" fill="#b7c3d2"/><text x="767.645215918713" y="244" fill="#68758b" font-size="11">18.12 km</text><rect x="260" y="260" width="498.645215918713" height="25" rx="5" fill="#2d766e"/><text x="767.645215918713" y="277" fill="#2d766e" font-size="11">18.12 km</text><text x="1010" y="254" fill="#182d48" font-size="11" font-weight="700">0.00% saved</text><text x="240" y="338" text-anchor="end" fill="#182d48" font-size="12" font-weight="700">Frequency × severity</text><rect x="260" y="319" width="650" height="25" rx="5" fill="#b7c3d2"/><text x="919" y="336" fill="#68758b" font-size="11">23.62 km</text><rect x="260" y="352" width="613.9500423370025" height="25" rx="5" fill="#2d766e"/><text x="882.9500423370025" y="369" fill="#2d766e" font-size="11">22.31 km</text><text x="1010" y="346" fill="#182d48" font-size="11" font-weight="700">5.51% saved</text><text x="240" y="430" text-anchor="end" fill="#182d48" font-size="12" font-weight="700">Severity × recency</text><rect x="260" y="411" width="650" height="25" rx="5" fill="#b7c3d2"/><text x="919" y="428" fill="#68758b" font-size="11">23.62 km</text><rect x="260" y="444" width="613.9500423370025" height="25" rx="5" fill="#2d766e"/><text x="882.9500423370025" y="461" fill="#2d766e" font-size="11">22.31 km</text><text x="1010" y="438" fill="#182d48" font-size="11" font-weight="700">5.51% saved</text><rect x="48" y="515" width="12" height="12" rx="2" fill="#b7c3d2"/><text x="67" y="525" fill="#68758b" font-size="10">Nearest neighbour</text><rect x="220" y="515" width="12" height="12" rx="2" fill="#2d766e"/><text x="239" y="525" fill="#68758b" font-size="10">2-opt order</text><text x="48" y="550" fill="#68758b" font-size="10">Open-route great-circle distance between configured points; not road distance or travel time.</text></g></svg>
